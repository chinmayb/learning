[project]
name = "rag-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chinmaya Bharadwaj", email = "cbharadwaj@infoblox.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
    "transformers>=5.20.1",
]

[project.scripts]
rag-lab = "rag_lab:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
